[package]
name = "ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

# Обмен между игрой (client.dll) и cef_host.exe: сообщения по двум анонимным каналам и кадры
# браузеров в общей памяти. Без CEF — client.dll не должен тянуть за собой libcef.dll.

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
winapi = { version = "0.3.9", features = ["fileapi", "handleapi", "memoryapi", "namedpipeapi", "winbase", "winnt", "minwinbase", "errhandlingapi", "synchapi", "processthreadsapi"] }
